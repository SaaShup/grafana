apiVersion: 1
contactPoints:
  - orgId: 1
    name: Discord - Paashup Alerts
    receivers:
      - uid: discord-paashup-alerts
        type: webhook
        settings:
          url: $__env{DISCORD_ALERT_WEBHOOK_URL}
          httpMethod: POST
          payload:
            template: |
              {
                "username": "Grafana Alerts",
                "embeds": [
                  {
                    "title": "{{ if .Alerts.Firing }}🔴 Container crashed on $__env{BASE_DOMAIN} — {{ len .Alerts.Firing }} firing{{ else }}🟢 Container recovered on $__env{BASE_DOMAIN} — {{ len .Alerts.Resolved }} resolved{{ end }}",
                    "color": {{ if .Alerts.Firing }}15548997{{ else }}5763719{{ end }},
                    "description": "{{ if .Alerts.Firing }}**🔻 Crashed**\n{{ range .Alerts.Firing }}• **{{ if .Labels.name }}{{ .Labels.name }}{{ else }}unknown container (metrics missing){{ end }}** — exit code {{ if .Labels.exit_code }}{{ .Labels.exit_code }}{{ else }}?{{ end }}\n{{ end }}{{ end }}{{ if .Alerts.Resolved }}**✅ Back up**\n{{ range .Alerts.Resolved }}• **{{ if .Labels.name }}{{ .Labels.name }}{{ else }}unknown container{{ end }}**\n{{ end }}{{ end }}[🔎 View in Grafana]({{ .ExternalURL }})"
                  }
                ]
              }
        disableResolveMessage: false
