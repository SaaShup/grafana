apiVersion: 1

groups:
  - orgId: 1
    name: paashup-containers
    folder: Paashup Alerts
    interval: $__env{ALERTING_INTERVAL}
    rules:
      - uid: paashup-container-down
        title: Container down
        condition: C
        # long enough for a VM reboot: containers and their metrics take a few minutes to come back
        for: 5m
        keep_firing_for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Container {{ if $labels.name }}{{ $labels.name }}{{ else }}(unknown — metrics missing){{ end }} crashed (exit code {{ if $labels.exit_code }}{{ $labels.exit_code }}{{ else }}?{{ end }}) on $__env{BASE_DOMAIN}."
        data:
          - refId: A
            datasourceUid: paashup-prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: |
                max by (name, exit_code) (
                  label_replace(
                    label_replace(
                      (
                        (netbox_docker_agent_container_exited{status!~"Exited \\(0\\).*"} * 0 + 1)
                        or
                        (netbox_docker_agent_container_exited{status=~"Exited \\(0\\).*"} * 0)
                        or
                        (netbox_docker_agent_container_stopped * 0)
                        or
                        (netbox_docker_agent_container_running * 0)
                      ),
                      "name",
                      "$1",
                      "name",
                      "^(.*?)(-[0-9]+)?$"
                    ),
                    "exit_code",
                    "$1",
                    "status",
                    "Exited \\(([0-9]+)\\).*"
                  )
                )
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: paashup-machines
    folder: Paashup Alerts
    interval: $__env{ALERTING_INTERVAL}
    rules:
      # Info only: the VM booted less than 10 minutes ago. The reason (updates, manual,
      # crash) is written on the VM's journal in paasbox by paasbox-boot-report.
      - uid: paashup-machine-restarted
        title: Machine restarted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          # $values.A.Value is nil when there's no node-exporter data (NoData state)
          summary: "{{ $labels.nodename }} restarted {{ with $values.A.Value }}{{ humanizeDuration . }} ago{{ else }}recently{{ end }} (kernel {{ $labels.release }})."
        data:
          - refId: A
            datasourceUid: paashup-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              # uptime, with the hostname and kernel as labels
              expr: |
                (time() - node_boot_time_seconds)
                  * on (instance) group_left (nodename, release) node_uname_info
              instant: true
              range: false
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [600]
