name: Build and publish on Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Docker Hub credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'saashup/grafana' }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upgrade-webhook:
    name: Notify upgrade webhook
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    steps:
      - name: Check webhook configuration
        env:
          WEBHOOK_DOMAIN: ${{ vars.WEBHOOK_DOMAIN }}
          WEBHOOK_PATH: ${{ secrets.WEBHOOK_PATH }}
        run: |
          missing=""
          [ -n "$WEBHOOK_DOMAIN" ] || missing="$missing WEBHOOK_DOMAIN"
          [ -n "$WEBHOOK_PATH" ] || missing="$missing WEBHOOK_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s)/variable(s):$missing"
            exit 1
          fi

      - name: Notify upgrade webhook
        env:
          WEBHOOK_URL: https://${{ vars.WEBHOOK_DOMAIN }}${{ secrets.WEBHOOK_PATH }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'saashup/grafana' }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":{\"repo_name\":\"$IMAGE\"},\"push_data\":{\"tag\":\"$TAG\"}}"
